name: Component and result checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements/cpu-constraints.txt -e ".[test,hqq,quanto]"
      - name: Verify components and optional adapters
        run: python -m pytest -q
      - name: Audit recorded results
        run: python scripts/verify_results.py
      - name: Check source distribution
        run: python scripts/check_release.py
