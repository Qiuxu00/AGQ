name: Result or reproduction question
description: Ask about a specific paper result, case, or measurement definition.
title: "[Results] "
body:
  - type: input
    id: reference
    attributes:
      label: Result or case
      description: Link the table row, case, or configuration.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup, if relevant
      description: Include the model source, quantized components, data split, precision, hardware, and timing scope. Do not attach weights.
