name: Quantization method integration
description: Propose a method or contribute a tested adapter.
title: "[Integration] "
body:
  - type: input
    id: method
    attributes:
      label: Method and official implementation
      placeholder: Method name and official repository URL
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: State the model components, bitwidths, calibration needs, and export format.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Separate matrix tests, model loading, single-input inference, and closed-loop evaluation. Include exact versions and hardware for measurements.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Attribution and license
      description: Identify any upstream code to be reused and its license.
